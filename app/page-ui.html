<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>&lt;page/&gt;</title>
  <style>
    /* —— minimalist dark theme —— */
    :root {
      --bg: #000c13;
      --panel: #111928;
      --text: #c7c7c7;
      --accent: #146e91dc;
    }

    * { box-sizing: border-box; font-family: Arial, sans-serif; }
    body { margin: 0; padding: 2rem; background: var(--bg); color: var(--text); }

    h1, h2 { margin: 0 0 1rem 0; font-weight: 500; }
    h1 { font-size: 1.8rem; }
    h2 { font-size: 1.2rem; margin-top: 2rem; }

    label { display: block; margin-top: 1rem; font-weight: 700; }

    input[type="text"], textarea {
      width: 100%;
      padding: 0.6rem;
      background: var(--panel);
      border: 1px solid var(--accent);
      border-radius: 6px;
      color: var(--text);
      font-size: 1rem;
    }

    textarea { height: 260px; font-family: monospace; resize: vertical; }

    button {
      margin-top: 1rem;
      padding: 0.5rem 1rem;
      background: var(--panel);
      border: 1px solid var(--accent);
      border-radius: 6px;
      color: var(--text);
      cursor: pointer;
      font-weight: 700;
    }
    button:hover { background: var(--accent); }

    /* list of pages */
    .page-item {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.5rem;
      margin-top: 0.8rem;
      padding: 0.6rem;
      background: var(--panel);
      border: 1px solid var(--accent);
      border-radius: 6px;
    }
    .page-item span { flex: 1 1 auto; font-weight: 700; word-break: break-all; }
    .page-item button { padding: 0.25rem 0.6rem; font-size: 0.8rem; }
  </style>
</head>
<body>
  <h1>&lt;page /&gt;</h1>

  <!-- ——— create / update form ——— -->
  <form id="pageForm" onsubmit="return false;">
    <label for="nameBox">Page name</label>
    <input id="nameBox" maxlength="20" autocomplete="off" />

    <label for="htmlInput">HTML</label>
    <textarea id="htmlInput" placeholder="Paste your HTML here"></textarea>

    <button id="saveBtn" type="button">Create Page</button>
  </form>

  <!-- ——— existing pages ——— -->
  <h2>My Pages</h2>
  <div id="listView"></div>

  <script>
    // =============== data helpers ===============
    let state = [];

    function post(tag, data) {
      fetch('/apps/page', {
        method: 'POST',
        body: JSON.stringify({ [tag]: data })
      });
    }

    async function getState() {
      const res = await fetch('/apps/page/state');
      return res.json();
    }

    // =============== UI helpers ===============
    function refreshSaveBtn() {
      const name = nameBox.value.trim();
      saveBtn.textContent = state.some(([n]) => n === name) ? 'Save Page' : 'Create Page';
    }

    function renderPages() {
      listView.innerHTML = '';
      state.forEach(([name, html], i) => {
        const div = document.createElement('div');
        div.className = 'page-item';

        div.innerHTML = `
          <span>${name}</span>
          <button onclick="importPage(${i})">Load</button>
          <button onclick="openPage('${name}')">Open</button>
          <button onclick="deletePage('${name}')">Delete</button>
        `;
        listView.appendChild(div);
      });
    }

    // =============== actions ===============
    async function loadAndRender() {
      state = (await getState()) || [];
      renderPages();
      refreshSaveBtn();
    }

    async function savePage() {
      const name = nameBox.value.trim();
      const html = htmlInput.value;

      if (!name) { alert('Name required'); return; }
      if (!/^[a-zA-Z0-9_.-]+$/.test(name)) { alert('Name can only contain letters, numbers, \'_ . -\''); return; }
      if (!html) { alert('HTML is empty'); return; }

      const exists = state.some(([n]) => n === name);
      if (exists && !confirm('Page exists. Overwrite?')) return;

      post('new-page', [name, html]);
      await loadAndRender();
    }

    function importPage(i) {
      const [name, html] = state[i];
      if (htmlInput.value && !confirm('Unsaved changes will be lost. Continue?')) return;
      nameBox.value = name;
      htmlInput.value = html;
      refreshSaveBtn();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    async function deletePage(name) {
      if (!confirm(`Delete ${name}?`)) return;
      post('delete-page', name);
      await loadAndRender();
    }

    function openPage(name) {
      window.open(`${window.origin}/apps/page/${name}`, '_blank');
    }

    // =============== events ===============
    nameBox.addEventListener('input', refreshSaveBtn);
    saveBtn.addEventListener('click', savePage);

    // first load
    loadAndRender();
  </script>
</body>
</html>
